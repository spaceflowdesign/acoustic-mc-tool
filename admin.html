<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060e"><title>Acoustic M.C ADMIN</title>
<link rel="stylesheet" href="admin.css">
</head><body>
<main class="admin-shell">
<header><div><h1>Acoustic M.C <b>ADMIN</b></h1><small>SPACE FLOW DESIGN · CONTROL CONSOLE</small></div><span id="adminState">AUTH CHECK</span></header>
<section id="loginPanel" class="panel"><h2>ADMIN AUTH</h2><p>SPACE FLOW DESIGN 管理者アカウントで認証してください。</p><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">SIGN IN</button><p id="loginStatus"></p></section>
<section id="console" hidden>
<div class="metrics"><article><span>TOTAL USERS</span><strong id="totalUsers">—</strong></article><article><span>ACTIVE</span><strong id="activeUsers">—</strong></article><article><span>CAUTION</span><strong id="cautionUsers">—</strong></article><article><span>BANNED</span><strong id="bannedUsers">—</strong></article></div>
<section class="panel"><div class="panel-head"><div><h2>USER CONTROL</h2><small>登録・最終利用・端末・状態</small></div><button id="refresh">REFRESH</button></div><input id="search" type="search" placeholder="メールアドレス / UIDで検索"><div class="table-wrap"><table><thead><tr><th>USER</th><th>LAST USE</th><th>DEVICES</th><th>STATE</th><th>ACTION</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="panel"><h2>OPERATIONS</h2><div class="ops"><span>最大登録端末 <b>2</b></span><span>通常更新 <b>認証維持</b></span><span>音声・動画・解析 <b>端末内</b></span></div></section>
<button id="logout" class="quiet">SIGN OUT</button>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="admin.js"></script>
</body></html>
